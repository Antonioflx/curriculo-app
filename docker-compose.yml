services:
  postgres:
    image: postgres:17
    container_name: curriculo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: curriculo
      POSTGRES_PASSWORD: curriculo
      POSTGRES_DB: curriculo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curriculo -d curriculo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

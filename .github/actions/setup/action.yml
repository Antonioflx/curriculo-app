name: setup
description: pnpm + Node + dependências (o checkout fica no workflow, porque esta action vem do repositório)

runs:
  using: composite # action feita só de passos de shell
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.4.1
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm # reaproveita o cache do pnpm entre runs
    # Falha se o pnpm-lock.yaml não bater com o package.json
    - run: pnpm install --frozen-lockfile
      shell: bash # obrigatório em passos `run` de action composite

# Fases do backend, chamadas pelo ci.yml. Rodam em paralelo; o CI só avisa, nunca corrige.
name: backend

on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_ENV: test
  WEB_ORIGIN: http://localhost:3000
  # O prisma generate lê a variável; não há banco no CI, ela é só um valor de forma.
  DATABASE_URL: postgresql://curriculo:ci-password@localhost:5432/curriculo
  JWT_SECRET: ci-only-secret-with-at-least-32-characters

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter backend prisma:generate
      - name: Formatação (Biome)
        run: pnpm format:check
      - name: Lint (ESLint)
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: Vulnerabilidades (alta ou crítica)
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter backend prisma:generate
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter backend prisma:generate
      - run: pnpm test

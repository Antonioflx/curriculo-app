packages:
  - backend
  - frontend

allowBuilds:
  argon2: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  "@parcel/watcher": false
  esbuild: false
  unrs-resolver: false
  workerd: false
  "@google/genai": false
  protobufjs: false

# Versões corrigidas de vulnerabilidades do `pnpm audit`: lodash (via Prisma Studio, só CLI)
# body-parser (via express, em runtime; DoS com corpo comprimido) e multer (via platform-express; DoS no upload).
# Remover quando as deps upstream atualizarem.
overrides:
  lodash: 4.18.1
  body-parser: 2.4.0
  multer: 2.5.0
